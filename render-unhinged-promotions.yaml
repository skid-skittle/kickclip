# Render configuration for Unhinged Promotions API
services:
  - type: web
    name: unhinged-promotions-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: unhinged_promotions
      - key: STRIPE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
